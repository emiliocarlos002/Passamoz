{% extends "operatorpanel/base.html" %}
{% block operator_content %}
<div class="row justify-content-center"><div class="col-xl-7">
<div class="card border-0 shadow-sm"><div class="card-body">
<h1 class="h4 mb-4">{{ title }}</h1>
<form method="post">{% csrf_token %}{{ form.as_p }}<div class="d-flex gap-2"><button class="btn btn-primary">Guardar</button><a class="btn btn-outline-secondary" href="{% url 'operatorpanel:'|add:back_url %}">Cancelar</a></div></form>
</div></div></div></div>
{% endblock %}
