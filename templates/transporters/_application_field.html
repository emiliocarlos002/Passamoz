<div class="application-field{% if wide %} wide{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <em>*</em>{% endif %}</label>
  <div class="application-input-wrap">{{ field }}</div>
  {% if field.help_text %}<small class="field-help">{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}
</div>
